<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário do Estudante</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-wrapper">
    <form id="student-form">
      
      <!-- Passo 1: Nome -->
      <div class="step active">
        <div class="step-content">
          <img src="logo.png" alt="Logotipo" class="step-image">
          <div class="input-group">
            <label for="nome">
              <strong>1.</strong> Nome do estudante <strong>(completo, sem abreviações)</strong>
            </label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo..." autocomplete="off" required autofocus>
            <div class="error-msg" id="err-nome">Por favor, insira o nome completo (nome e sobrenome).</div>
          </div>
        </div>
      </div>

      <!-- Passo 2: CPF -->
      <div class="step">
        <div class="step-content">
          <img src="logo.png" alt="Logotipo" class="step-image">
          <div class="input-group">
            <label for="cpf">
              <strong>2.</strong> CPF do estudante <strong>(somente números)</strong>
            </label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off" required>
            <div class="error-msg" id="err-cpf">Informe um CPF válido com 11 dígitos.</div>
          </div>
        </div>
      </div>

      <!-- Passo 3: Telefone -->
      <div class="step">
        <div class="step-content">
          <img src="logo.png" alt="Logotipo" class="step-image">
          <div class="input-group">
            <label for="telefone">
              <strong>3.</strong> Telefone do estudante <strong>(somente números)</strong>
            </label>
            <input type="tel" id="telefone" name="telefone" placeholder="16991234567" maxlength="15" autocomplete="off" required>
            <div class="error-msg" id="err-telefone">Informe o telefone completo com DDD (11 dígitos).</div>
          </div>
        </div>
      </div>

      <!-- Passo 4: Endereço -->
      <div class="step">
        <div class="step-content">
          <img src="logo.png" alt="Logotipo" class="step-image">
          <div class="input-group">
            <label for="endereco">
              <strong>4.</strong> Endereço completo <strong>com CEP</strong>
            </label>
            <textarea id="endereco" name="endereco" rows="3" placeholder="Rua, número, bairro, cidade - UF, CEP 00000-000" required></textarea>
            <div class="error-msg" id="err-endereco">Por favor, preencha o endereço completo com o CEP.</div>
          </div>
        </div>
      </div>

      <!-- Ações de Navegação -->
      <div class="nav-controls">
        <button type="button" id="btn-prev" class="btn btn-secondary" disabled>Anterior</button>
        <button type="button" id="btn-next" class="btn btn-primary">Avançar</button>
        <button type="submit" id="btn-submit" class="btn btn-success" style="display: none;">Concluir</button>
      </div>

    </form>

    <!-- Barra de Progresso -->
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
