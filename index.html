<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Interativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <form id="typeform" action="https://formspree.io/f/SEU_ID_AQUI" method="POST">
      
      <!-- Passo 1 -->
      <div class="step active">
        <label for="nome"><span class="step-num">1 →</span> Qual é o seu nome?</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui..." required autofocus>
        <button type="button" class="btn-next">OK ✓</button>
      </div>

      <!-- Passo 2 -->
      <div class="step">
        <label for="email"><span class="step-num">2 →</span> Qual o seu e-mail de contato?</label>
        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
        <button type="button" class="btn-next">OK ✓</button>
      </div>

      <!-- Passo 3 -->
      <div class="step">
        <label for="mensagem"><span class="step-num">3 →</span> Como posso te ajudar?</label>
        <textarea id="mensagem" name="mensagem" rows="3" placeholder="Escreva sua mensagem..." required></textarea>
        <button type="submit" class="btn-submit">Enviar</button>
      </div>

    </form>

    <!-- Indicador de Progresso -->
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
